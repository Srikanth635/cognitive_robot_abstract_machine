<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>llm_reasoner viewer</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <h1>llm_reasoner viewer</h1>
    <label class="run-picker">
      <span class="visually-hidden">Run</span>
      <select id="run-select"><option>no runs yet</option></select>
    </label>
    <span id="run-status" class="badge"></span>
    <div id="totals" class="totals"></div>
    <span id="connection" class="connection">connecting…</span>
    <a id="cram-viz-link" class="button-link" target="_blank" rel="noopener" hidden title="Open this run in cram-viz: its scene, what it resolved and the hypothesis it consulted">open in cram-viz</a>
    <button id="replay-toggle" type="button" title="Watch the run again, as it happened">replay</button>
    <button id="events-toggle" type="button" aria-controls="events-drawer" aria-expanded="false">events</button>
  </header>
  <div id="replay-bar" class="replay-bar" hidden></div>
  <main class="screen">
    <section class="panel" id="map-panel" aria-label="System">
      <h2>System</h2>
      <div id="map"></div>
      <ul class="legend">
        <li><span class="swatch status-running"></span>going on now</li>
        <li><span class="swatch status-ok"></span>done</li>
        <li><span class="swatch status-rejected"></span>rejected, tried again</li>
        <li><span class="swatch status-failed"></span>failed</li>
      </ul>
      <p class="hint">Click a component to single out its row on the timeline.</p>
    </section>
    <section class="panel" id="timeline-panel" aria-label="Timeline">
      <h2>Timeline</h2>
      <div id="filters" class="filter-bar"></div>
      <div id="timeline"></div>
    </section>
    <aside class="panel" id="inspector-panel" aria-label="Inspector">
      <h2>Inspector</h2>
      <div id="inspector"></div>
    </aside>
    <section class="panel" id="attempts-panel" aria-label="Attempts" hidden></section>
  </main>
  <section id="events-drawer" aria-label="Events" hidden>
    <div id="events"></div>
  </section>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
